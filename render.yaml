# One origin serves the React app and Express API. Atlas is configured separately.
services:
  - type: web
    name: parkease
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health/ready
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: /api
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: "10"
      - key: ENTRY_GRACE_MINUTES
        value: "15"
      - key: QR_TTL_SECONDS
        value: "300"
      - key: EXPIRY_SWEEP_MS
        value: "30000"
